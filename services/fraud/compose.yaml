# Live NVIDIA GraphSAGE + XGBoost sidecar. Artifacts are gitignored.
# Same mounts as scripts/serve.sh: the whole graph (training split + test window) so
# neighbourhoods have real history, and scripts/ because infer_server.py imports
# temporal_graph.py from it.
services:
  fraud-gnn:
    image: ${FRAUD_TRAIN_IMAGE:-nvcr.io/nvidia/cugraph/financial-fraud-training:3.0.0}
    gpus: all
    shm_size: 8g
    ports:
      - "127.0.0.1:${FRAUD_INFER_PORT:-8000}:8000"
    environment:
      FRAUD_OUTPUT: /workspace/output
      FRAUD_GRAPH_DATA: /data
    volumes:
      - ./.cache/train:/workspace/output:ro
      - ./.cache/graph:/data:ro
      - ./scripts:/workspace/scripts:ro
    entrypoint: ["python3", "/workspace/scripts/infer_server.py"]
    profiles: ["gnn"]
