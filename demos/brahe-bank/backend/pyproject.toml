[project]
name = "galileo-langgraph-fsi-agent"
version = "0.1.0"
description = "A demo langgraph Financial Services agent with Galileo evaluations"
license = "MIT"
requires-python = "<3.14,>=3.12"
dependencies = [
  "fastapi>=0.115.13,<0.116",
  "galileo==2.6.0",
  "agent-control-sdk==8.5.0",
  "agent-control-models==8.5.0",
  "agent-control-evaluators==8.5.0",
  "grandalf>=0.8",
  "httpx>=0.28,<0.29",
  "langchain-community>=0.3.24",
  "langchain-pinecone>=0.2.6",
  "langchain[openai]~=0.3.18",
  "langgraph~=0.4.7",
  "langgraph-supervisor>=0.0.26",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<1.39",
  "opentelemetry-sdk>=1.38,<1.39",
  "pinecone[asyncio]>=6.0.2",
  "python-dotenv>=1.1.0",
  "splunk-otel-instrumentation-langchain==0.1.16",
  "truststore>=0.10,<0.11",
  "uvicorn>=0.34.3,<0.35",
]

[dependency-groups]
dev = [
  "ruff>=0.11.11",
  "pytest (>=8.4.1,<9.0.0)",
  "pytest-dotenv>=0.5.2"
]

[tool.ruff]
line-length = 120
