<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'">
  <title>Studio architecture diagram</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
    #canvas{position:absolute;inset:0;width:100%;height:100%;overflow:auto;background:#0b111b}
    #canvas [role=button]{cursor:pointer;outline:none}
    #canvas foreignObject,#canvas foreignObject *{pointer-events:none!important}
    #canvas [role=button]:focus{filter:drop-shadow(0 0 3px #6b99ff)}
    #overview{position:absolute;bottom:14px;right:14px;width:164px;height:86px;background:#101722e8;border:1px solid #43516a;border-radius:8px;padding:7px;color:#b5c3d6;cursor:pointer;overflow:hidden}
    #overview svg{display:block;width:100%;height:55px}
    #overview span{font-size:11px}
    #overview:empty{display:none}
    html[data-theme=light] #overview{background:#ffffffec;color:#475569;border-color:#94a3b8}
  </style>
  <script>
    // All viewer code and diagram assets are served by this Studio.
    window.DRAWIO_BASE_URL = '/vendor/drawio';
    window.STYLE_PATH = '/vendor/drawio/styles';
    window.SHAPES_PATH = '/vendor/drawio/shapes';
    window.STENCIL_PATH = '/vendor/drawio/stencils';
    window.GRAPH_IMAGE_PATH = '/vendor/drawio/img';
    window.mxBasePath = '/vendor/drawio/mxgraph';
    window.mxImageBasePath = '/vendor/drawio/mxgraph/images';
    window.mxLoadResources = false;
    window.onDrawioViewerLoad = function () {};
  </script>
  <script src="/vendor/drawio/viewer-static.min.js"></script>
</head>
<body>
  <div id="canvas" aria-label="Architecture diagram"></div>
  <button id="overview" type="button" aria-label="Fit whole architecture"></button>
  <script type="module" src="/diagrams/viewer.js"></script>
</body>
</html>
